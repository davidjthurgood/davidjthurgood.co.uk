  <script>window.HERO_SRC = 'img/usa-2026/07-taos/20_TOAS.jpg';</script>
  <script>
(function () {
  var data = window.IMAGE_DATA;

  // A page may nominate any image as its hero by setting window.HERO_SRC before
  // this script. That image is pulled to the front; everything else keeps its
  // running order and flows through the layout below as normal. Without it, the
  // hero is simply the first image in the data.
  if (window.HERO_SRC) {
    var heroIdx = -1;
    for (var h = 0; h < data.length; h++) {
      if (data[h].src === window.HERO_SRC) { heroIdx = h; break; }
    }
    if (heroIdx > 0) {
      data = data.slice();
      data.unshift(data.splice(heroIdx, 1)[0]);
    } else if (heroIdx === -1) {
      console.warn('HERO_SRC not found in IMAGE_DATA: ' + window.HERO_SRC);
    }
  }

  // Row patterns: each entry is an array of gridColumn values for images in that row.
  // A row with 1 entry = solo image; 2 entries = pair.
  // Grid is 6 columns. Each conceptual column = 2 grid units.
  //
  //  | 1 | 2 | 3 | 4 | 5 | 6 |
  //  |  col A  |  col B  |  col C  |

  var PAIR_PATTERNS = [
    ['1 / span 2', '5 / span 2'],  // flank: A + C, empty centre
    ['1 / span 2', '3 / span 2'],  // left pair: A + B
    ['3 / span 2', '5 / span 2'],  // right pair: B + C
  ];

  // Solo patterns — left, right, centre (in that order to avoid leading with centre)
  var SOLO_COLS = ['1 / span 2', '5 / span 2', '3 / span 2'];

  var LAND_COLS = [
    '1 / span 4',  // land-left: A + B
    '3 / span 4',  // land-right: B + C
    '2 / span 4',  // land-feature: inset centred
  ];

  // Feature: wide centred single image (occupies cols 2–5)
  var FEATURE_COL = '2 / span 4';
  var FEATURE_INTERVAL = 6; // place a feature row every N solo portraits

  var pairIdx = 0;
  var soloIdx = 0;
  var landIdx = 0;
  var soloCount = 0; // counts solo (non-paired) portrait placements

  var items = []; // flat list of { src, orientation, gridCol }

  // First image always centred at feature width, no extra top margin (title provides spacing)
  items.push({ src: data[0].src, orientation: data[0].orientation,
               gridCol: FEATURE_COL, solo: false });

  var i = 1;
  while (i < data.length) {
    var cur = data[i];
    var nxt = data[i + 1];

    if (cur.orientation === 'landscape') {
      items.push({ src: cur.src, orientation: cur.orientation,
                   gridCol: LAND_COLS[landIdx % LAND_COLS.length], solo: true });
      landIdx++;
      i++;

    } else if (nxt && nxt.orientation !== 'landscape') {
      // Two consecutive non-landscape images → pair row
      var cols = PAIR_PATTERNS[pairIdx % PAIR_PATTERNS.length];
      pairIdx++;
      items.push({ src: cur.src, orientation: cur.orientation, gridCol: cols[0] });
      items.push({ src: nxt.src, orientation: nxt.orientation, gridCol: cols[1] });
      i += 2;

    } else {
      // Solo non-landscape image
      soloCount++;
      var col;
      if (soloCount % FEATURE_INTERVAL === 0) {
        // Feature row: wide centred image
        col = FEATURE_COL;
        // After a feature, advance soloIdx past centre to avoid placing the
        // next solo image directly below the feature's footprint (cols 2–5)
        if (SOLO_COLS[soloIdx % SOLO_COLS.length] === '3 / span 2') {
          soloIdx++;
        }
      } else {
        col = SOLO_COLS[soloIdx % SOLO_COLS.length];
        soloIdx++;
      }
      items.push({ src: cur.src, orientation: cur.orientation, gridCol: col, solo: true });
      i++;
    }
  }

  // Render
  var grid = document.createElement('div');
  grid.className = 'grid';

  for (var j = 0; j < items.length; j++) {
    var item = items[j];
    var div = document.createElement('div');
    div.className = 'grid__item grid__item--' + item.orientation + (item.solo ? ' grid__item--solo' : '');
    div.style.gridColumn = item.gridCol;

    var img = document.createElement('img');
    img.src = item.src;
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    div.appendChild(img);
    grid.appendChild(div);
  }

  document.body.appendChild(grid);
}());
  </script>
